<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Your Style — Magnet Clinical Solutions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
      background: #eef0f7;
    }

    /* ===== SIDEBAR ===== */
    #sidebar {
      width: 220px;
      min-width: 220px;
      background: #fff;
      box-shadow: 2px 0 24px rgba(27,42,107,0.10);
      display: flex;
      flex-direction: column;
      z-index: 10;
      overflow-y: auto;
    }

    #sidebar-top {
      padding: 1.4rem 1.2rem 1rem;
      border-bottom: 1px solid #eef0f7;
    }

    #sidebar-top .label {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #8a92b2;
      margin-bottom: 0.4rem;
    }

    #sidebar-top h1 {
      font-size: 0.98rem;
      font-weight: 700;
      color: #1a1f3c;
      margin-bottom: 0.5rem;
    }

    #sidebar-top p {
      font-size: 0.76rem;
      color: #6a7099;
      line-height: 1.5;
    }

    #theme-list {
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      flex: 1;
    }

    .theme-btn {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.6rem 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid transparent;
      background: transparent;
      width: 100%;
      text-align: left;
      transition: background 0.15s, border-color 0.15s;
    }

    .theme-btn:hover { background: #f4f5fb; }
    .theme-btn.active { background: #f0f2fb; border-color: #1B2A6B; }

    .theme-num-badge {
      width: 28px;
      height: 28px;
      min-width: 28px;
      border-radius: 6px;
      background: #eef0f7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.78rem;
      font-weight: 700;
      color: #4a5080;
      transition: background 0.15s, color 0.15s;
    }

    .theme-btn.active .theme-num-badge {
      background: #1B2A6B;
      color: #fff;
    }

    .theme-info { flex: 1; min-width: 0; }

    .theme-name {
      font-size: 0.78rem;
      font-weight: 600;
      color: #1a1f3c;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .theme-desc {
      font-size: 0.68rem;
      color: #8a92b2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #sidebar-footer {
      padding: 1rem 1.2rem 1.4rem;
      border-top: 1px solid #eef0f7;
    }

    #sidebar-footer p {
      font-size: 0.74rem;
      color: #8a92b2;
      line-height: 1.55;
    }

    #sidebar-footer strong {
      display: block;
      font-size: 0.78rem;
      color: #1a1f3c;
      margin-bottom: 0.3rem;
    }

    #current-label {
      margin-top: 0.75rem;
      background: #1B2A6B;
      color: #fff;
      border-radius: 6px;
      padding: 0.55rem 0.9rem;
      font-size: 0.8rem;
      font-weight: 600;
      text-align: center;
    }

    /* ===== PREVIEW ===== */
    #preview {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #preview iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    #loading-overlay {
      position: absolute;
      inset: 0;
      background: #eef0f7;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0.75rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
    }

    #loading-overlay.show { opacity: 1; pointer-events: all; }

    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #d0d4e8;
      border-top-color: #1B2A6B;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #loading-overlay span {
      font-size: 0.82rem;
      color: #8a92b2;
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <div id="sidebar-top">
      <div class="label">Magnet Clinical Solutions</div>
      <h1>Pick your style</h1>
      <p>Click each number to preview a completely different design. Tell Eugen the number you want!</p>
    </div>

    <div id="theme-list"></div>

    <div id="sidebar-footer">
      <strong>How to choose</strong>
      <p>Scroll through all 10 designs — they each have a completely different look and feel.</p>
      <div id="current-label">Viewing: Style 1</div>
    </div>
  </div>

  <div id="preview">
    <div id="loading-overlay" class="show">
      <div class="spinner"></div>
      <span>Loading preview…</span>
    </div>
    <iframe id="frame" src="" title="Website preview"></iframe>
  </div>

  <script>
    const STYLES = [
      { id: 1,  name: 'Classic Navy',        desc: 'Professional & authoritative', src: 'suggestion-1/index.html' },
      { id: 2,  name: 'Minimal Elegant',     desc: 'Clean, airy, light/dark toggle', src: 'suggestions/s2.html' },
      { id: 3,  name: 'Dark Tech',           desc: 'Dark, modern, technical',       src: 'suggestions/s3.html' },
      { id: 4,  name: 'Medical Green',       desc: 'Clinical, trustworthy, clean',  src: 'suggestions/s4.html' },
      { id: 5,  name: 'Bold Editorial',      desc: 'High contrast, bold type',      src: 'suggestions/s5.html' },
      { id: 6,  name: 'Glassmorphism',       desc: 'Frosted glass, modern blur',    src: 'suggestions/s6.html' },
      { id: 7,  name: 'Warm Earth',          desc: 'Warm tones, approachable',      src: 'suggestions/s7.html' },
      { id: 8,  name: 'Split Parallax',      desc: 'Dynamic, two-panel layout',     src: 'suggestions/s8.html' },
      { id: 9,  name: 'Neon Biotech',        desc: 'Vivid, cutting-edge, bold',     src: 'suggestions/s9.html' },
      { id: 10, name: 'Editorial Magazine',  desc: 'Typographic, sophisticated',    src: 'suggestions/s10.html' },
    ];

    const frame = document.getElementById('frame');
    const overlay = document.getElementById('loading-overlay');
    const currentLabel = document.getElementById('current-label');
    const list = document.getElementById('theme-list');

    let active = 1;

    function loadStyle(id) {
      active = id;
      const style = STYLES.find(s => s.id === id);

      document.querySelectorAll('.theme-btn').forEach(b => {
        b.classList.toggle('active', parseInt(b.dataset.id) === id);
      });
      currentLabel.textContent = `Viewing: Style ${id}`;

      overlay.classList.add('show');
      frame.src = style.src;
    }

    frame.addEventListener('load', () => {
      overlay.classList.remove('show');
    });

    // Build buttons
    STYLES.forEach(s => {
      const btn = document.createElement('button');
      btn.className = 'theme-btn';
      btn.dataset.id = s.id;
      btn.innerHTML = `
        <div class="theme-num-badge">${s.id}</div>
        <div class="theme-info">
          <div class="theme-name">${s.name}</div>
          <div class="theme-desc">${s.desc}</div>
        </div>
      `;
      btn.addEventListener('click', () => loadStyle(s.id));
      list.appendChild(btn);
    });

    // Load style 1 on start
    loadStyle(1);
  </script>
</body>
</html>
